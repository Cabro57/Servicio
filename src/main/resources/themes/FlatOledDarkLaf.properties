#
# Servicio OLED Dark - saf siyah koyu tema
#
# FlatDarkLaf'in uzerine yuklenir; sadece degistirilmesi gereken degerler
# burada tanimlidir (FlatLaf onerisi: tum dosyayi kopyalama).
#

#---- degiskenler ----

# Saf siyah zemin: OLED panelde piksel tamamen kapali kalir
@background = #000000
@foreground = #d7d7d7
@disabledForeground = shade(@foreground,45%)

# Yuzeyler: zeminden bir tik acik ki katmanlar birbirinden ayrilsin
@componentBackground = #0e0e0e
@buttonBackground = #17171a
@menuBackground = #050505

# Vurgu rengi (kullanici ayarindan gelen accent varsa o gecerli olur)
@accentBaseColor = #2f81f7

#---- kenarlik / ayrac ----

Component.borderColor = #2b2b2b
Component.disabledBorderColor = #1c1c1c
Separator.foreground = #202020
PopupMenu.borderColor = #262626
MenuBar.borderColor = $Separator.foreground

#---- pencere ----

TitlePane.background = #000000
TitlePane.inactiveBackground = #000000
RootPane.activeBorderColor = #2b2b2b
RootPane.inactiveBorderColor = #1c1c1c
Desktop.background = #000000

#---- tablo / liste / agac ----

Table.gridColor = #1b1b1b
Table.alternateRowColor = #0a0a0a
TableHeader.background = #0a0a0a
TableHeader.separatorColor = #232323
TableHeader.bottomSeparatorColor = #232323
Tree.hash = #1b1b1b

#---- kaydirma cubugu ----

ScrollBar.track = #000000
ScrollBar.thumb = #2e2e2e
ScrollBar.hoverTrackColor = #0c0c0c
ScrollBar.hoverThumbColor = #3d3d3d
ScrollBar.pressedThumbColor = #4a4a4a

#---- diger ----

ProgressBar.background = #1c1c1c
ToolTip.background = #141414
