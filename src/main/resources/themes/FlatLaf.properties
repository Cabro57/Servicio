    border:2,5,2,5;\
    [light]foreground:#f43f5e;\
    [light]background:fade(#f43f5e,10%);\
    [dark]foreground:#FE9A9F;\
    [dark]background:fade(#FE9A9F,14%);

[style]Label.greenBadge=\
    arc:8;\
    border:2,5,2,5;\
    [light]foreground:#1f9669;\
    [light]background:fade(#1f9669,10%);\
    [dark]foreground:#3FCD94;\
