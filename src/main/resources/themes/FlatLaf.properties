# Ayarlar modalinin sol gezinme alani: kartlarla ayni ton, kenarliksiz.
[style]Panel.settingsNav=    [dark]background:tint($Panel.background,3%);    [light]background:tint($Panel.background,25%);

[style]Button.actionButton=\
    arc:8;\
    background:null;\
    focusColor:null;\
    hoverBorderColor:$Button.foreground;\
    focusedBorderColor:null;\
    font:bold;

[style]TextField.searchField=\
    arc:8;\
    background:null;\
    focusColor:$TextField.foreground;\
    focusedBorderColor:null;\
    font:16;

[style]TextField.serviceSearchField=\
    arc:8;\
    focusColor:null;\
    font:14;

[style]Panel.editServicePanel=\
    arc:8;\
    background:$Table.background;

# --- Anlamsal renk token'lari (tr.cabro.servicio.application.themes.SemanticColor) ---
# Acik/koyu ayri tanimli: UI kodunda ham hex yazilmaz, tema degisince otomatik cozulur.
# Acik tema degerleri beyaz zeminde >=4.5:1 kontrast verecek sekilde secildi.
# Koyu tema degerleri ayni aileden: acik rengin OKLCH tonu (hue) korunur, parlaklik koyu kart
# zemininde (FlatDark Panel #3C3F41 ve Table #464849) >=4.5:1 okunana kadar artirilir. Eski koyu
# degerler baska bir aileden geliyordu (neon yesil, somon) ve bir kismi bu zeminde 4.5:1'in altindaydi.
# Tek istisna uyari: ayni tonda (43) tehlikeyle karisiyordu (ikisi de seftali-pembe), bu yuzden
# koyu temada amber tarafina (60) kaydirildi.
[light]Servicio.successColor = #0E7C4A
[dark]Servicio.successColor  = #33D083
[light]Servicio.dangerColor  = #B42318
[dark]Servicio.dangerColor   = #FE9B93
[light]Servicio.warningColor = #B54708
[dark]Servicio.warningColor  = #FFA24D
[light]Servicio.infoColor    = #175CD3
[dark]Servicio.infoColor     = #8EB8FF
[light]Servicio.actionColor  = #6941C6
[dark]Servicio.actionColor   = #BBADFF

# Vurgu (accent) dolgulu yuzeylerin ustundeki yazi/ikon rengi. Button.default.foreground vurguya gore
# hesaplanmiyor (acik temada her zaman siyah, koyu temada panel rengi); kullanici acik bir vurgu
# (yesil, sari, turuncu) secince yazi kayboluyordu. Vurgunun parlakligina gore siyah/beyaz secilir.
Servicio.onAccentForeground = contrast($Component.accentColor,#1c1c1e,#ffffff,40%)

# Tehlike dolgulu (geri alinamaz: sil, tasi ve sil) dugmelerin ustundeki yazi/ikon rengi.
# Tehlike dolgusu: geri alinamaz eylemin dugmesi (Sil, Tasi ve sil, Geri yukle). Acik temada
# dangerColor ile ayni; koyu temada dangerColor (somon) yazi rengi olarak iyi ama dolgu olarak
# beyaz yaziyi tasimiyor ve sekerleme gibi duruyordu, bu yuzden ayni tonda daha derin bir kirmizi
# (beyaz yaziyla 5.5:1).
[light]Servicio.dangerFill = $Servicio.dangerColor
[dark]Servicio.dangerFill  = #C23326
Servicio.onDangerForeground = contrast($Servicio.dangerFill,#1c1c1e,#ffffff,40%)

# --- Liste sayfalari (AbstractTableForm) ---
# Tabloyu tasiyan kart: tablo zemininde, ince cizgi, 15px kose. Tablo kartin kendisi gibi okunur.
[style]Panel.listCard=\
    background:$Table.background;\
    border:1,1,1,1,$Component.borderColor,1,15;

# Satir hover / secim zeminleri. Secim vurgu renginden turetilir ama yazi rengi degismez.
[light]Servicio.rowHoverBackground    = darken($Table.background,3%)
[dark]Servicio.rowHoverBackground     = lighten($Table.background,4%)
[light]Servicio.rowSelectedBackground = mix($Component.accentColor,$Table.background,12%)
[dark]Servicio.rowSelectedBackground  = mix($Component.accentColor,$Table.background,22%)

# --- Acilir menuler (tum JPopupMenu'ler: sag tik, "Diger", siralama, form, filtre; combo listeleri) ---
# listCard dilinde: tablo zemini, ince cizgi, 12px kose. Uzerine gelinen oge vurgu rengiyle DOLMAZ
# (tek vurgu kurali); tablo satiri gibi hafif notr bir ton alir, yazi rengi degismez.
# Secim tonu opak tutulur: combo ve ozel listelerin opak hucrelerinde yari saydam renk iz birakirdi.
[light]Servicio.menuSelectionBackground = darken($Table.background,7%)
[dark]Servicio.menuSelectionBackground  = lighten($Table.background,8%)

Popup.borderCornerRadius = 12
PopupMenu.borderInsets = 5,5,5,5
PopupMenu.borderColor = $Component.borderColor
PopupMenu.background = $Table.background
PopupMenuSeparator.height = 9
PopupMenuSeparator.stripeIndent = 4
PopupMenuSeparator.foreground = $Component.borderColor

MenuItem.margin = 7,12,7,16
MenuItem.iconTextGap = 10
MenuItem.minimumWidth = 160
MenuItem.selectionArc = 8
MenuItem.selectionInsets = 0,0,0,0
MenuItem.selectionBackground = $Servicio.menuSelectionBackground
MenuItem.selectionForeground = $Label.foreground
MenuItem.acceleratorSelectionForeground = $Label.disabledForeground

Menu.margin = $MenuItem.margin
Menu.selectionBackground = $MenuItem.selectionBackground
Menu.selectionForeground = $MenuItem.selectionForeground

CheckBoxMenuItem.margin = $MenuItem.margin
CheckBoxMenuItem.selectionBackground = $MenuItem.selectionBackground
CheckBoxMenuItem.selectionForeground = $MenuItem.selectionForeground
CheckBoxMenuItem.acceleratorSelectionForeground = $Label.disabledForeground
RadioButtonMenuItem.margin = $MenuItem.margin
RadioButtonMenuItem.selectionBackground = $MenuItem.selectionBackground
RadioButtonMenuItem.selectionForeground = $MenuItem.selectionForeground
RadioButtonMenuItem.acceleratorSelectionForeground = $Label.disabledForeground

# Combo acilir listesi ayni menu dilinde: icten 5px bosluk, 8px koseli notr secim.
ComboBox.popupInsets = 5,5,5,5
ComboBox.selectionArc = 8
ComboBox.popupBackground = $Table.background
ComboBox.selectionBackground = $Servicio.menuSelectionBackground
ComboBox.selectionForeground = $Label.foreground

# --- Kaydirma cubuklari: icerigin ustune biner, yalnizca kullanilirken gorunur ---
# Kaydirinca, cubugun kenarina yaklasinca ya da tutulurken belirir; ~1 sn sonra kaybolur.
# Ayrinti: application/component/scroll/OverlayScrollPaneUI.
ScrollPaneUI = tr.cabro.servicio.application.component.scroll.OverlayScrollPaneUI
ScrollBarUI = tr.cabro.servicio.application.component.scroll.OverlayScrollBarUI
ScrollBar.width = 10
