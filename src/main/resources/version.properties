# Bu dosya Maven tarafindan derleme sirasinda otomatik doldurulur.
# src/main/resources/version.properties konumuna koyun.
# pom.xml'de <filtering>true</filtering> zaten aktif.

# Uygulama surumu — Maven ${project.version} ile otomatik guncellenir
version=${project.version}

# Guncelleme manifest URL'si
# Manifest, imzasi (<url>.sig) ve release-notes.json son release'in eki olarak yayinlanir
# (release.ps1). Ayni klasorden okunurlar; kendi sunucuya gecilirse ucu de ayni yere konur:
#   https://updates.orneksite.com/servicio/update-manifest.json
#
# Eski surumler hala master'daki raw manifesti okur; release.ps1 onu da guncel tutar.
manifest.url=https://github.com/Cabro57/Servicio/releases/latest/download/update-manifest.json